path_base: repository-root
scope: 已核对审核前端、数据集分析、LoRA 文件工具、BAT 启动主链路，以及独立缩放、翻转和角色标签脚本；Python 处理模块保留原有组织结构。
not_yet_mapped:
  - addTags、deduplicate 等其他独立图片与标签工具的内部算法
  - 检测、几何裁框与模型客户端的内部实现
features:
  - id: dataset-utilities
    name: 独立图片缩放、水平翻转与角色标签脚本
    keywords: [resize, reverse, edit_caption, 缩放, 翻转, 角色标签, dataset-raw]
    doc: docs/features/dataset-utilities.md
    entrypoints:
      - core/resize.py
      - core/reverse.py
      - core/edit_caption.py
  - id: review-app
    name: React 审核前端、裁切与标签编辑
    keywords: [React, Vite, app/src, 裁框, 标签, 批量编辑, 筛选, 预览, 导出]
    doc: docs/features/review-app.md
    entrypoints:
      - app/src/Pages/review/ReviewPage/ReviewPage.tsx
      - app/src/Pages/review/useReview.ts
      - core/dataset_pipeline/review.py
  - id: dataset-analysis
    name: 本地数据集分析
    keywords: [分析, 亮度, 姿势, 重复, 报告, CSV, 对照]
    doc: docs/features/dataset-analysis.md
    entrypoints:
      - app/src/Pages/analysis/AnalysisView/AnalysisView.tsx
      - core/dataset_pipeline/analysis_job.py
  - id: lora-files
    name: LoRA 文件重命名与效果对比提示词
    keywords: [LoRA, output, safetensors, rename, generate_lora_tag, 重命名, 提示词]
    doc: docs/features/lora-files.md
    entrypoints:
      - app/src/Pages/lora/LoraTools/LoraTools.tsx
      - core/rename.py
      - core/generate_lora_tag.py
  - id: launcher
    name: BAT、Forge 与前后端启动
    keywords: [start-webui.bat, npm run dev, Forge, 启动, 等待, 端口, 独立终端]
    doc: docs/features/launcher.md
    entrypoints:
      - start-webui.bat
      - core/launch_webui.py
      - core/dataset_pipeline/frontend.py
